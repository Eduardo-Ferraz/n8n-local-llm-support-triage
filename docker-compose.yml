services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.6
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      # The workflow reads and writes files only under /data (the ./data folder of this repo).
      N8N_RESTRICT_FILE_ACCESS_TO: /data
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    extra_hosts:
      # Lets the container reach LM Studio (or any OpenAI-compatible server) running on the host.
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data
      - ./workflow:/workflow:ro

volumes:
  n8n_data:
